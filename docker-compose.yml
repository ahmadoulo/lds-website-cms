networks:
  lds_network:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: lds-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lds_db}
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - lds_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lds_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lds-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SuperSecretPassword123!}
    ports:
      - "9010:9000"
      - "9011:9001"
    networks:
      - lds_network
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-setup:
    image: minio/mc
    container_name: lds-minio-setup
    networks:
      - lds_network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-SuperSecretPassword123!};
      /usr/bin/mc mb myminio/${MINIO_BUCKET:-lds-media} --ignore-existing;
      /usr/bin/mc policy set download myminio/${MINIO_BUCKET:-lds-media};
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lds-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lds_db}?schema=public
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-SuperSecretPassword123!}
      - MINIO_BUCKET=${MINIO_BUCKET:-lds-media}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_example}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super_secret_jwt_refresh_key_example}
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL:-admin@lougasolidaire.org}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:-Password123!}
      - CORS_ORIGIN=${FRONTEND_URL:-http://38.242.228.14:8096}
    ports:
      - "3020:3000"
    networks:
      - lds_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Default fallback for local testing
        VITE_API_URL: ${API_URL:-http://38.242.228.14:3020/api/v1}
    container_name: lds-frontend
    ports:
      - "8096:80"
    networks:
      - lds_network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
