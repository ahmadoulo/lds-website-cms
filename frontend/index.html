<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The association's own mark, cropped square from the logo it supplied.
      A PNG rather than an SVG because iOS Safari accepts only a raster image
      for the home screen. A favicon uploaded from the administration replaces
      both links at runtime - see src/components/seo/Favicon.tsx.
    -->
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-mark.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-mark.png" />
    <meta name="theme-color" content="#172642" />

    <title>Louga Développement Solidaire</title>
    <meta
      name="description"
      content="Association à but non lucratif engagée pour l'éducation, la santé et le développement durable des Lougatois, au Sénégal et depuis la diaspora."
    />
    <meta name="robots" content="index,follow" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Louga Développement Solidaire" />
    <meta property="og:title" content="Louga Développement Solidaire" />
    <meta
      property="og:description"
      content="Association à but non lucratif engagée pour l'éducation, la santé et le développement durable des Lougatois."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Plausible, self-hosted at analytics.senovate.cloud.

      Deferred, so it never competes with the first paint. The matching
      script-src and connect-src entries are in nginx.conf: the second one is
      the easy half to forget, and without it the tracker loads and then
      records nothing at all.

      The queue stub the install snippet puts beside this tag lives in
      main.tsx instead. It is three lines of inline JavaScript, and allowing
      inline script in the policy to carry them would have cost the one
      directive that does the most to contain an XSS.
    -->
    <script
      defer
      data-domain="ldslouga.sn"
      src="https://analytics.senovate.cloud/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"
    ></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Ce site nécessite JavaScript. Vous pouvez nous joindre par email à
      lougasolidaire@gmail.com.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
