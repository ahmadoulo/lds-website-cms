# The site is served from a single origin: nginx hands static files to the
# browser and forwards /api to the backend container over the Docker network.
# That is why the browser never needs to know the backend's address, and why
# there is no CORS between the two.

# Note on the repeated `add_header` blocks below: nginx only inherits headers
# into a location that declares none of its own, so every location that adds one
# has to restate the whole set.

# If another proxy (Traefik, Cloudflare, an nginx terminating TLS) sits in front,
# keep the scheme and host IT saw. Overwriting them with $scheme would make the
# API build http:// image URLs for an https:// page, and browsers block that as
# mixed content.
map $http_x_forwarded_proto $lds_proto {
    default          $scheme;
    "~^(http|https)$" $http_x_forwarded_proto;
}

map $http_x_forwarded_host $lds_host {
    default   $http_host;
    "~^.+$"   $http_x_forwarded_host;
}

# HSTS, but only on a response that actually travelled over TLS. Sent over
# plain http it is ignored by browsers and misleading to read in a config.
#
# Deliberately without includeSubDomains and without preload: both are
# promises about hosts this container knows nothing about, and preload is
# effectively irreversible. This covers the host being served here. Widening
# it is a decision to take once the subdomains in use have been listed.
map $lds_proto $lds_hsts {
    default "";
    https   "max-age=31536000";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Image uploads are capped at 5 MB by the API; nginx defaults to 1 MB and
    # would reject them with 413 before the request ever reaches the backend.
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Without it, `proxy_pass http://backend:3000` is
    # resolved once at startup: nginx would fail to boot if the backend is not up
    # yet, and would keep a stale IP after the backend restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------------ API
    location /api/ {
        # The hostname is held in a variable so it is re-resolved at request
        # time. With a variable, nginx no longer rewrites the URI, so the
        # original path has to be passed on explicitly.
        set $lds_backend http://backend:3000;
        proxy_pass $lds_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The API builds absolute media URLs and rate-limits per client IP from
        # these two headers.
        proxy_set_header X-Forwarded-Proto $lds_proto;
        proxy_set_header X-Forwarded-Host  $lds_host;

        # Streamed images must reach the browser as they arrive, and a slow
        # upload must not be cut off mid-transfer.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # No add_header here on purpose. The backend already sends its own
        # security headers via helmet, and duplicating them would produce two
        # copies of each. It also means no Content-Security-Policy is applied to
        # /api/docs, whose Swagger UI relies on inline scripts.
    }

    # -------------------------------------------------------------- static
    # Hashed build assets are immutable and can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------ crawlers
    # Both are generated by the API, because both have to state absolute URLs
    # and neither knows the site's address at build time: the same image is
    # deployed to the preview host and to ldslouga.sn. They are served from the
    # paths a crawler actually asks for, not from /api/v1.
    location = /robots.txt {
        set $lds_seo http://backend:3000;
        proxy_pass $lds_seo/api/v1/public/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $lds_proto;
        proxy_set_header X-Forwarded-Host  $lds_host;
    }

    # Without this the SPA fallback answers /favicon.ico with index.html and a
    # text/html content type, which some crawlers log as a broken icon. There is
    # no such file - the real icon is served from the media API - so 404 is the
    # honest answer.
    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
    }

    location = /sitemap.xml {
        set $lds_seo http://backend:3000;
        proxy_pass $lds_seo/api/v1/public/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $lds_proto;
        proxy_set_header X-Forwarded-Host  $lds_host;
    }

    # index.html must never be cached, otherwise a deploy stays invisible to
    # browsers still holding the previous asset hashes.
    # Served as a file, never proxied: this is where the API reads the shell it
    # writes the metadata into, so routing it through @shell would be a loop.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security $lds_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Images and fonts shipped with the build but not hashed. They change only
    # when the build does, so a month is safe and must-revalidate means a
    # replacement is picked up as soon as it lands rather than a month later.
    location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
        add_header Strict-Transport-Security $lds_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The administration is behind a login and asks not to be indexed, so it
    # is served the plain shell. Routing it through the metadata renderer
    # would add a hop to every screen for no benefit at all.
    location /admin {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security $lds_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files /index.html =404;
    }

    # A real file wins; anything else is a page, and a page gets its own
    # metadata written into it before it leaves.
    location / {
        try_files $uri @shell;
    }

    #
    # The SPA shell with this page's own title, description, canonical,
    # hreflang, Open Graph and JSON-LD already in it.
    #
    # The built index.html carries the home page's generic set and nothing
    # else, so every article shared on WhatsApp, Facebook or LinkedIn showed
    # the site's preview instead of its own: those crawlers do not run
    # JavaScript, and the correct tags only appeared once React had.
    #
    # The path and the language travel as headers rather than in a query
    # string, because $uri arrives decoded and re-inserting it into a query
    # would misread any path containing an ampersand.
    #
    location @shell {
        set $lds_shell http://backend:3000;
        proxy_pass $lds_shell/api/v1/public/page-shell;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $lds_proto;
        proxy_set_header X-Forwarded-Host  $lds_host;
        proxy_set_header X-LDS-Path        $uri;
        proxy_set_header X-LDS-Lang        $arg_lang;

        # A page must never hang waiting for the API. If it is slow or down,
        # the visitor gets the static shell - exactly what they got before
        # this location existed.
        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;

        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security $lds_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # The previous behaviour, kept as the floor: whatever happens to the API,
    # the site still answers with a working single-page application.
    location @spa {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security $lds_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files /index.html =404;
    }
}
