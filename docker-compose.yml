networks:
  lds_network:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: lds-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing. Run ./scripts/setup-env.sh to generate it}
      POSTGRES_DB: ${POSTGRES_DB:-lds_db}
    # Bound to loopback only: the database is never reachable from the internet.
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - lds_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lds_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lds-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is missing. Run ./scripts/setup-env.sh to generate it}
    # Object storage stays private; images are streamed through the API.
    # The console is published on loopback for administration over an SSH tunnel.
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    networks:
      - lds_network
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      # `mc ready` is the documented probe; the HTTP endpoint is kept as a
      # fallback so a change in the image's bundled tools cannot wedge startup.
      test:
        [
          "CMD-SHELL",
          "mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lds-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lds_db}?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is missing. Run ./scripts/setup-env.sh to generate it}
      MINIO_BUCKET: ${MINIO_BUCKET:-lds-media}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing. Run ./scripts/setup-env.sh to generate it}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is missing. Run ./scripts/setup-env.sh to generate it}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@lougasolidaire.org}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?ADMIN_SEED_PASSWORD is missing. Run ./scripts/setup-env.sh to generate it}
      # Both are optional in the default single-origin setup: the browser talks
      # to nginx, which proxies /api here, so there is no cross-origin request to
      # authorise and the API derives its own public address from the forwarded
      # headers. Set them only when the API is served on a separate domain.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    # Not published on a public interface: the API is reached through nginx.
    # The loopback binding keeps Swagger and debugging available over an SSH
    # tunnel without exposing the service to the internet.
    ports:
      - "127.0.0.1:3020:3000"
    networks:
      - lds_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty means "same origin": the bundle calls /api/v1 and nginx proxies
        # it to the backend. Only set this for a separate API domain.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: lds-frontend
    # The only port that needs to be reachable from the internet.
    ports:
      - "${SITE_PORT:-8096}:80"
    networks:
      - lds_network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
