# The site is served from a single origin: nginx hands static files to the
# browser and forwards /api to the backend container over the Docker network.
# That is why the browser never needs to know the backend's address, and why
# there is no CORS between the two.

# Note on the repeated `add_header` blocks below: nginx only inherits headers
# into a location that declares none of its own, so every location that adds one
# has to restate the whole set.

# If another proxy (Traefik, Cloudflare, an nginx terminating TLS) sits in front,
# keep the scheme and host IT saw. Overwriting them with $scheme would make the
# API build http:// image URLs for an https:// page, and browsers block that as
# mixed content.
map $http_x_forwarded_proto $lds_proto {
    default          $scheme;
    "~^(http|https)$" $http_x_forwarded_proto;
}

map $http_x_forwarded_host $lds_host {
    default   $http_host;
    "~^.+$"   $http_x_forwarded_host;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Image uploads are capped at 5 MB by the API; nginx defaults to 1 MB and
    # would reject them with 413 before the request ever reaches the backend.
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Without it, `proxy_pass http://backend:3000` is
    # resolved once at startup: nginx would fail to boot if the backend is not up
    # yet, and would keep a stale IP after the backend restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------------ API
    location /api/ {
        # The hostname is held in a variable so it is re-resolved at request
        # time. With a variable, nginx no longer rewrites the URI, so the
        # original path has to be passed on explicitly.
        set $lds_backend http://backend:3000;
        proxy_pass $lds_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The API builds absolute media URLs and rate-limits per client IP from
        # these two headers.
        proxy_set_header X-Forwarded-Proto $lds_proto;
        proxy_set_header X-Forwarded-Host  $lds_host;

        # Streamed images must reach the browser as they arrive, and a slow
        # upload must not be cut off mid-transfer.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # No add_header here on purpose. The backend already sends its own
        # security headers via helmet, and duplicating them would produce two
        # copies of each. It also means no Content-Security-Policy is applied to
        # /api/docs, whose Swagger UI relies on inline scripts.
    }

    # -------------------------------------------------------------- static
    # Hashed build assets are immutable and can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        expires 1d;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1d;
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise a deploy stays invisible to
    # browsers still holding the previous asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Client-side routing: any unknown path is handled by React Router.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # Same-origin API and images, so the policy can stay strict.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
